[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bugclassinet"
version = "0.1.0"
description = "Reproducible hierarchical software issue classification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0", "pyarrow>=14", "PyYAML>=6.0", "scikit-learn>=1.3",
  "joblib>=1.3", "numpy>=1.24"
]

[project.optional-dependencies]
transformers = [
  "transformers>=4.47", "accelerate>=1.0", "torch>=2.2", "datasets>=2.18",
  "sentencepiece>=0.2", "protobuf>=4.25"
]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
bugclassinet = "bugclassinet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
